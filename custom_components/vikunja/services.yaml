create_task:
  target:
    entity:
      integration: vikunja
      domain: todo
  fields:
    title:
      required: true
      example: "Take out the bins"
      selector:
        text:
    description:
      example: "Blue bin this week"
      selector:
        text:
          multiline: true
    due_datetime:
      example: "2026-11-21 19:00:00"
      selector:
        datetime:
    priority:
      selector:
        select:
          translation_key: priority
          options:
            - low
            - medium
            - high
            - urgent
            - do_it_now
    labels:
      example: "Household"
      selector:
        text:
          multiple: true
